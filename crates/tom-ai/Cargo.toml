[package]
name = "tom-ai"
# Vendored from the tom workspace, which targets edition 2021 (the code
# predates the edition-2024 `unsafe` requirements on `std::env::set_var`).
edition = "2021"
publish.workspace = true
license = "MIT"
version = "0.17.0"
description = "Unified multi-provider LLM types and streaming for the embedded tom agent runtime"
readme = "README.md"
keywords = ["agent", "llm", "ai", "anthropic", "openai"]
categories = ["api-bindings", "asynchronous", "artificial-intelligence"]

[dependencies]
tom-telemetry = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true, optional = true, features = [
    "json",
    "stream",
    "rustls-tls-native-roots",
    "charset",
    "http2",
] }
bytes = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# Real HTTP providers (anthropic, openai). Off by default so core builds remain
# network-free.
providers = ["dep:reqwest", "dep:bytes", "dep:eventsource-stream"]
# Live network smoke test, gated further by the ANTHROPIC_API_KEY env var at runtime.
smoke = ["providers"]
