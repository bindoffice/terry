[package]
name = "tom-tui"
version = "0.17.1"
edition = "2021"
publish.workspace = true
license = "MIT"
documentation = "https://docs.rs/tom-tui"
description = "Terminal User Interface for tom"
readme = "README.md"
keywords = ["agent", "llm", "ai", "terminal", "tui"]
categories = ["command-line-interface", "api-bindings"]

[dependencies]
crossterm = { version = "0.27", features = ["events", "bracketed-paste"] }
unicode-width = "0.1"
unicode-segmentation = "1"
thiserror.workspace = true
tracing.workspace = true
regex = "1"
base64 = "0.22"
similar = { version = "2", features = ["text", "unicode"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase", "wincon", "winuser"] }

[features]
default = []
image-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
