[package]
name = "terminal_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/terminal_core.rs"
doctest = false

# Deliberately free of `gpui`, `theme`, and `settings`: this crate is shared by
# the GUI and by the headless terminal daemon, so it may only depend on the VT
# state machine itself.
[dependencies]
alacritty_terminal.workspace = true
serde.workspace = true
serde_json.workspace = true
vte.workspace = true
