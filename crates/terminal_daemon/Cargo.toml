[package]
name = "terminal_daemon"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "terry-daemon"
path = "src/main.rs"

[dependencies]
agent_catalog.workspace = true
agent_detect.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
axum = "0.8.9"
futures.workspace = true
libc.workspace = true
log.workspace = true
paths.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sysinfo.workspace = true
terminal_core.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
