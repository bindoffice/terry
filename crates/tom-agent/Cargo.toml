[package]
name = "tom-agent"
# Vendored from the tom workspace, which targets edition 2021 (the code
# predates the edition-2024 `unsafe` requirements on `std::env::set_var`).
edition = "2021"
publish.workspace = true
license = "MIT"
version = "0.17.0"
description = "Agent loop, tools and events for the embedded tom agent runtime"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "sdk"]
categories = ["api-bindings", "asynchronous", "artificial-intelligence"]

[dependencies]
tom-telemetry = { workspace = true }
tom-ai = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
